name: Build Mesa (Bookworm Fast)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch or tag'
        required: true
        default: 'adreno-debian-bookworm'
      api_override:
        description: 'Vulkan API version (e.g. 1.4.301)'
        required: false
        default: ''
      draft_release:
        description: 'Draft release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      options: --privileged --user root

    steps:
      - name: Prepare APT (safe)
        run: |
          set -e
          echo 'Acquire::Languages "none";' > /etc/apt/apt.conf.d/99nolanguages

          if [ -f /etc/apt/sources.list ]; then
            sed -i 's/deb.debian.org/mirrors.edge.kernel.org/g' /etc/apt/sources.list
          fi

          if [ -d /etc/apt/sources.list.d ]; then
            sed -i 's/deb.debian.org/mirrors.edge.kernel.org/g' /etc/apt/sources.list.d/* || true
          fi

      - name: Install dependencies (FAST)
        run: |
          set -e
          apt update

          apt install -y --no-install-recommends \
            git ca-certificates \
            build-essential meson ninja-build pkg-config \
            python3 python3-mako \
            libdrm-dev libexpat1-dev \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxrandr-dev libxshmfence-dev \
            libwayland-dev wayland-protocols \
            libvulkan-dev glslang-tools \
            libelf-dev libunwind-dev \
            bison flex \
            devscripts fakeroot quilt git-buildpackage pristine-tar \
            ccache

          apt clean

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G

      - name: Clone repo
        run: |
          set -e
          cd ~
          git clone -b "${{ github.event.inputs.tag }}" --depth 1 \
            "${{ github.server_url }}/${{ github.repository }}.git" mesa-src

      - name: Apply Vulkan override
        if: ${{ github.event.inputs.api_override != '' }}
        run: |
          set -e
          cd ~/mesa-src

          VER="${{ github.event.inputs.api_override }}"
          VER_UNDERSCORE=$(echo "$VER" | tr '.' '_')

          FILE=$(find src/freedreno/vulkan -maxdepth 1 \( -name "tu_device.c" -o -name "tu_device.cc" \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: tu_device file not found"
            find src/freedreno/vulkan -maxdepth 1 -type f
            exit 1
          fi

          echo "Patching $FILE → Vulkan $VER"

          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER_UNDERSCORE}/" "$FILE"

      - name: Build Mesa (fixed)
        run: |
          set -e
          export CCACHE_DIR=/root/.ccache
          cd ~/mesa-src

          echo "Preparing source..."
          origtargz

          echo "Building..."
          gbp buildpackage -uc -us -j4 --git-ignore-branch

      - name: Collect packages
        run: |
          set -e
          cd ~

          rm -f *dev* *dbgsym* libosmesa*.deb \
                mesa-va-drivers*.deb mesa-vdpau-drivers*.deb || true

          find . -maxdepth 1 -name "*.deb" -type f -printf "%P\n" | sort

          sha256sum *.deb > sha256sums.txt
          cat sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-build
          path: |
            ~/*.deb
            ~/sha256sums.txt

  release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ github.event.inputs.tag }}
          name: Mesa Build (${{ github.event.inputs.tag }})
          files: artifacts/**/*.deb
