name: Build Debian for (Bookworm)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch or tag'
        required: true
        default: 'adreno-debian-bookworm'
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      options: --privileged --user root

    steps:
      - name: Prepare APT
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          printf '%s\n' 'Acquire::Languages "none";' > /etc/apt/apt.conf.d/99nolanguages
          printf '%s\n' 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99norecommends
          printf '%s\n' 'APT::Install-Suggests "false";' > /etc/apt/apt.conf.d/99nosuggests

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-bookworm-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            apt-bookworm-${{ runner.arch }}-

      - name: Install dependencies (FAST)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            ccache \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-mako \
            python3-pip \
            glslang-tools \
            flex \
            bison \
            devscripts \
            fakeroot \
            quilt \
            git-buildpackage \
            pristine-tar \
            libxfixes-dev \
            libarchive-dev \
            libdrm-dev \
            libexpat1-dev \
            libx11-dev \
            libxext-dev \
            libxdamage-dev \
            libxrandr-dev \
            libxshmfence-dev \
            libwayland-dev \
            wayland-protocols \
            libvulkan-dev \
            libelf-dev \
            libunwind-dev

          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          set -euo pipefail
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Clone repository
        run: |
          set -euo pipefail
          cd ~
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone -b "${{ github.event.inputs.tag }}" --depth 1 \
            "${{ github.server_url }}/${{ github.repository }}.git" mesa-src

      - name: Build Mesa
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR=/root/.ccache
          cd ~/mesa-src

          origtargz
          gbp buildpackage -uc -us -j4 --git-ignore-branch

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          cd /root

          rm -f *dev* *dbgsym* libosmesa*.deb mesa-va-drivers*.deb mesa-vdpau-drivers*.deb || true

          if [[ "${{ github.event.inputs.tag }}" == *"turnip"* ]]; then
            find /root -maxdepth 1 -type f -name "*.deb" ! -name "mesa-vulkan-drivers*" -delete
          fi

          find /root -maxdepth 1 -type f -name "*.deb" -printf "%f\n" | sort
          find /root -maxdepth 1 -type f -name "*.deb" -printf "%f\0" | xargs -0 sha256sum | sort -k2 > /root/sha256sums.txt
          cat /root/sha256sums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-for-android-container_${{ github.event.inputs.tag }}
          path: |
            /root/*.deb
            /root/sha256sums.txt
          retention-days: 90

  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs:
      - build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Build release notes with checksums
        shell: bash
        run: |
          set -euo pipefail
          checksums=$(find ./artifacts -type f -name "sha256sums.txt" -exec cat {} \; | awk 'NF>=2 {print $1 "  " $2}' | sort -k2,2)

          cat > release_body.md <<'EOF'
          ## Checksums
          ```plaintext
          EOF
          printf '%s\n' "$checksums" >> release_body.md
          printf '%s\n' '```' >> release_body.md

      - name: Set release title
        shell: bash
        run: |
          set -euo pipefail
          version=$(find ./artifacts -type f -name 'mesa-vulkan-drivers*.deb' -print -quit | xargs basename | cut -d'_' -f2)

          if [[ "${{ github.event.inputs.tag }}" == *"turnip"* ]]; then
            echo "RELEASE_TITLE=turnip-${version}_debian_bookworm" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TITLE=${version}_debian_bookworm" >> "$GITHUB_ENV"
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ env.RELEASE_TITLE }}
          draft: true
          body_path: release_body.md
          files: |
            ./artifacts/**/*.deb
