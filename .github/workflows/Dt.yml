name: Build Turnip (Bookworm - tar.xz)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (branch/tag)'
        required: true
        default: 'main'
      api_override:
        description: 'Vulkan API override (e.g., 1.4.301)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      options: --privileged --user root

    steps:
      - name: Prepare APT
        run: |
          export DEBIAN_FRONTEND=noninteractive
          printf '%s\n' 'Acquire::Languages "none";' > /etc/apt/apt.conf.d/99nolanguages
          printf '%s\n' 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99norecommends
          printf '%s\n' 'APT::Install-Suggests "false";' > /etc/apt/apt.conf.d/99nosuggests

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-bookworm-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            apt-bookworm-${{ runner.arch }}-

      - name: Install build dependencies (no packaging tools)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git ccache build-essential \
            meson ninja-build pkg-config python3 python3-mako glslang-tools \
            flex bison curl \
            libdrm-dev libexpat1-dev libx11-dev libxext-dev libxdamage-dev \
            libxfixes-dev libxrandr-dev libxshmfence-dev \
            libwayland-dev wayland-protocols libvulkan-dev \
            libelf-dev libunwind-dev libarchive-dev
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.mesa_version }} \
            https://gitlab.freedesktop.org/mesa/mesa.git /root/mesa

      - name: Apply Turnip pthread→mtx fix (Termux compatibility)
        run: |
          cd /root/mesa
          sed -i 's/pthread_mutex_lock(&dev->pipeline_mutex)/mtx_lock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc
          sed -i 's/pthread_mutex_unlock(&dev->pipeline_mutex)/mtx_unlock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc

      - name: Override Vulkan API version (if requested)
        if: github.event.inputs.api_override != ''
        run: |
          cd /root/mesa
          VER="${{ github.event.inputs.api_override }}"
          DEVFILE=$(find src/freedreno/vulkan -maxdepth 1 -name 'tu_device.*' -print -quit)
          [ -z "$DEVFILE" ] && { echo "tu_device file not found"; exit 1; }
          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER//\./_}/" "$DEVFILE"

      - name: Configure Mesa build (Turnip only)
        run: |
          meson setup build /root/mesa \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dplatforms=x11,wayland \
            -Dllvm=disabled \
            -Dbuildtype=release \
            -Dprefix=/usr \
            -Dstrip=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dshared-glapi=disabled \
            -Ddri3=disabled \
            -Dshader-cache=enabled

      - name: Build Turnip
        run: ninja -C build

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package driver
        run: |
          mkdir -p /tmp/turnip-pkg
          cp build/src/freedreno/vulkan/libvulkan_freedreno.so /tmp/turnip-pkg/
          TARNAME="turnip-${{ github.event.inputs.mesa_version }}-bookworm-arm64.tar.xz"
          tar -cJf "/root/$TARNAME" -C /tmp/turnip-pkg .
          echo "artifact_name=$TARNAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.mesa_version }}-bookworm-arm64
          path: /root/turnip-*.tar.xz
