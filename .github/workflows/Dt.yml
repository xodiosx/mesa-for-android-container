name: Build Debian for (Bookworm)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch or tag'
        required: true
        default: 'adreno-debian-bookworm'
      draft_release:
        description: 'Draft a new release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      options: --privileged --user root

    steps:
      - name: Speed up APT
        run: |
          echo 'Acquire::Languages "none";' > /etc/apt/apt.conf.d/99nolanguages
          sed -i 's/deb.debian.org/mirrors.edge.kernel.org/g' /etc/apt/sources.list

      - name: Install dependencies (FAST)
        run: |
          apt update

          apt install -y --no-install-recommends \
            git ca-certificates \
            build-essential meson ninja-build pkg-config \
            python3 python3-mako \
            libdrm-dev libexpat1-dev \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxrandr-dev libxshmfence-dev \
            libwayland-dev wayland-protocols \
            libvulkan-dev glslang-tools \
            libelf-dev libunwind-dev \
            bison flex \
            devscripts fakeroot quilt git-buildpackage pristine-tar \
            ccache

          apt clean

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --zero-stats
          ccache --show-stats

      - name: Clone repository
        run: |
          cd ~
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git clone -b ${{ github.event.inputs.tag }} --depth 1 \
            ${{ github.server_url }}/${{ github.repository }}.git

      - name: Build Mesa (FASTER)
        run: |
          export CCACHE_DIR=/root/.ccache
          cd ~/mesa-for-android-container

          echo "Preparing source..."
          origtargz

          echo "Building Mesa..."
          gbp buildpackage -uc -us -j4 --git-ignore-branch

          echo "Build done!"

      - name: Collect packages
        run: |
          cd ~

          rm -f *dev* *dbgsym* libosmesa*.deb \
                mesa-va-drivers*.deb mesa-vdpau-drivers*.deb

          if [[ "${{ github.event.inputs.tag }}" == *"turnip"* ]]; then
            find . -maxdepth 1 -type f -name "*.deb" ! -name "mesa-vulkan-drivers*" -delete
          fi

          find . -maxdepth 1 -name "*.deb" -type f -printf "%P\0" \
            | xargs -0 sha256sum | sort -k2 > sha256sums.txt

          cat sha256sums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mesa-${{ github.event.inputs.tag }}
          path: |
            ~/*.deb
            ~/sha256sums.txt
          retention-days: 90

  draft-release:
    if: ${{ github.event.inputs.draft_release == 'true' }}
    needs: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Generate release notes
        run: |
          checksums=$(find ./artifacts -name "sha256sums.txt" -exec cat {} \; | sort -k2)

          echo "## Checksums" > release_body.md
          echo '```plaintext' >> release_body.md
          echo "$checksums" >> release_body.md
          echo '```' >> release_body.md

      - name: Set release title
        run: |
          version=$(find ./artifacts -name 'mesa-vulkan-drivers*.deb' | head -n1 | xargs basename | cut -d'_' -f2)

          if [[ "${{ github.event.inputs.tag }}" == *"turnip"* ]]; then
            echo "RELEASE_TITLE=turnip-${version}_debian_bookworm" >> $GITHUB_ENV
          else
            echo "RELEASE_TITLE=${version}_debian_bookworm" >> $GITHUB_ENV
          fi

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ env.RELEASE_TITLE }}
          draft: true
          body_path: release_body.md
          files: ./artifacts/**/*.deb
