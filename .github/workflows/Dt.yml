name: Build Turnip (Bookworm - tar.xz)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (branch/tag)'
        required: true
        default: 'main'
      api_override:
        description: 'Vulkan API override (e.g., 1.4.301)'
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      options: --privileged --user root

    steps:
      - name: Prepare APT
        run: |
          export DEBIAN_FRONTEND=noninteractive
          printf '%s\n' 'Acquire::Languages "none";' > /etc/apt/apt.conf.d/99nolanguages
          printf '%s\n' 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99norecommends
          printf '%s\n' 'APT::Install-Suggests "false";' > /etc/apt/apt.conf.d/99nosuggests

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-bookworm-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            apt-bookworm-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git ccache build-essential cmake \
            pkg-config python3 python3-mako python3-pip \
            flex bison curl unzip \
            libdrm-dev libexpat1-dev libx11-dev libxext-dev libxdamage-dev \
            libxfixes-dev libxrandr-dev libxshmfence-dev \
            libwayland-dev wayland-protocols libvulkan-dev \
            libelf-dev libunwind-dev libarchive-dev

          # Remove old system glslang-tools if present
          apt-get purge -y glslang-tools || true

          # Upgrade meson (Bookworm ships 1.0.1, Mesa needs >= 1.4.0)
          python3 -m pip install --upgrade meson --break-system-packages

          # Build glslang from source (native ARM64, minimal deps)
          git clone --depth 1 https://github.com/KhronosGroup/glslang.git /tmp/glslang
          cd /tmp/glslang
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_OPT=OFF \
            -DENABLE_HLSL=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build --parallel $(nproc)
          cmake --install build
          rm -rf /tmp/glslang

          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          export CCACHE_DIR=/root/.ccache
          ccache --max-size=2G
          ccache --show-config
          ccache --zero-stats
          ccache --show-stats

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.mesa_version }} \
            https://gitlab.freedesktop.org/mesa/mesa.git /root/mesa

      - name: Override Vulkan API version (optional)
        if: github.event.inputs.api_override != ''
        run: |
          VER="${{ github.event.inputs.api_override }}"
          FILE=$(find /root/mesa/src/freedreno/vulkan -maxdepth 1 \( -name 'tu_device.c' -o -name 'tu_device.cc' \) -print -quit)
          [ -z "$FILE" ] && { echo "tu_device file not found"; exit 1; }
          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER//\./_}/" "$FILE"

      - name: Configure Mesa (native, Turnip only)
        run: |
          meson setup build /root/mesa \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dbuildtype=release \
            -Dpython=python3.11

      - name: Build
        run: ninja -C build

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /root/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package driver
        run: |
          mkdir -p /tmp/turnip-pkg
          cp build/src/freedreno/vulkan/libvulkan_freedreno.so /tmp/turnip-pkg/
          TARNAME="turnip-${{ github.event.inputs.mesa_version }}-bookworm-arm64.tar.xz"
          tar -cJf "/root/$TARNAME" -C /tmp/turnip-pkg .
          echo "artifact_name=$TARNAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.mesa_version }}-bookworm-arm64
          path: /root/turnip-*.tar.xz
